# App containers only. Postgres and Redis are external — set DATABASE_URL and
# REDIS_URL in `.env` (see `.env.example`). Secrets stay in `.env`, not here.
#
# Working order:
#   1. cp .env.example .env  → fill DATABASE_URL, REDIS_URL, and API secrets
#   2. docker compose up --build
#   3. Web http://localhost:3000  ·  API http://localhost:4000/api/v1
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # Override local .env values that differ inside Compose
      NODE_ENV: production
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # DATABASE_URL + REDIS_URL: from env_file (.env) → managed services
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_NEXCONN_APP_KEY: ${NEXT_PUBLIC_NEXCONN_APP_KEY:-}
    # Do not env_file the full .env — that would leak API secrets into the web container.
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Must reach the API service name on the Compose network (not localhost)
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_NEXCONN_APP_KEY: ${NEXT_PUBLIC_NEXCONN_APP_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
